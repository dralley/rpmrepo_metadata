[package]
name = "rpmrepo_metadata"
version = "0.6.1"
authors = ["Daniel Alley <dalley@redhat.com>"]
edition = "2024"
license = "MPL-2.0"
description = "A library for parsing RPM repository metadata."
include = ["/src", "/benches", "/pyproject.toml", "/README.md", "/README_PYTHON.md", "/LICENSE.txt"]
readme = "README.md"
repository = "https://github.com/dralley/rpmrepo_metadata/"
homepage = "https://github.com/dralley/rpmrepo_metadata/"
documentation = "https://docs.rs/rpmrepo_metadata/"

[features]
python_ext = ["pyo3", "rpm-version/python", "serialize"]
read_rpm = ["rpm"]
supportinfo = []
# Derive serde `Serialize` on the metadata data types and enable JSON/dict output.
serialize = ["dep:serde", "dep:serde_json"]
default = ["read_rpm"]

[dependencies]
quick-xml = {  git = "https://github.com/tafia/quick-xml.git", default-features = false }
# rayon = "1.5.1"
thiserror = "2"
niffler = { version = "3", features = ["bz2", "lzma", "gz", "zstd"], default-features = false }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
bzip2 = { version = "0.6" }
rpm = { version = "0.27.1", default-features = false, optional = true }
# tempdir = "0.3.7"
digest = "0.10.6"
sha1 = "0.10.5"
sha2 = "0.10.6"
md-5 = "0.10.5"
# bitflags = "1.3.2"
hex = "0.4.3"
ahash = "0.8"
compact_str = "0.10"
indexmap = { version = "2.14.0", features = ["serde"] }
rpm-version = "0.5.1"
pyo3 = { version = "0.29.0", features = ["extension-module", "indexmap"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[lib]
name = "rpmrepo_metadata"
crate-type = ["lib", "cdylib"]

[dev-dependencies]
tempdir = "0.3.7"
pretty_assertions = "1.4.0"
criterion = "0.8.2"

[[test]]
name = "package"
required-features = ["read_rpm"]
path = "tests/package.rs"

[[example]]
name = "write_repo"
required-features = ["read_rpm"]

[[test]]
name = "supportinfo"
required-features = ["supportinfo"]
path = "tests/supportinfo.rs"

[[bench]]
name = "repository"
harness = false

[profile.dev]
opt-level = 1

[profile.release]
debug = 1
lto = "thin"
